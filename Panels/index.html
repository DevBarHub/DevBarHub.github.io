<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panels</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1 {
  font-weight: normal;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

button {
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: white;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  font-size: 14px;
  transition: 0.2s;
  max-width: 400px;
}

button:hover {
  transform: scale(1.02);
  background: #eef3ff;
}

.title {
  font-weight: bold;
  font-size: 15px;
}

.desc {
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<h1>Panels</h1>

<div class="container">

  <!-- 🔹 ÚNICO PANEL -->
  <button onclick="go('/SystemInfo/')">
    <div class="title">System Information</div>
    <div class="desc">View device, network, GPU and browser data</div>
  </button>

</div>

<script>

function go(url){
  window.location.href = url;
}

</script>

</body>
</html>
