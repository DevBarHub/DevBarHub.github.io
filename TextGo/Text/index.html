<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #333;
      text-align: center;
    }

    .container {
      margin-top: 120px;
    }

    h1 {
      font-size: 96px;
      margin: 0;
      color: #444;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
      font-size: 16px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      Sorry, the page you are looking for does not exist.
    </p>
    <a href="/">Return to Home</a>
  </div>
</body>
</html>
